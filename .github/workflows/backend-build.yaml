name: "Backend: Build"
on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_call:
    inputs:
      build-jar:
        type: boolean
        required: false
        default: true
      build-docker:
        type: boolean
        required: false
        default: false
      upload-jar:
        type: boolean
        required: false
        default: false

defaults:
  run:
    working-directory: ./backend  # Change the working directory to /backend

jobs:
  build-docker:
    name: Build (${{ matrix.variant }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'pull_request' || inputs.build-docker }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false

  build-jar:
    name: Build Jar
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' || inputs.build-jar }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
      - name: Build Jar
        run: ./gradlew build
      - name: Upload Jar
        if: ${{ inputs.upload-jar }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error
